name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./dev.db
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_BRAND_NAME: PromptVault
      NEXT_PUBLIC_BRAND_DOMAIN: localhost
      NEXT_PUBLIC_BRAND_HANDLE: promptvault
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: CI-Demo-Password-Only-123!

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run db:push
      - run: npm run db:seed
      - run: npm run lint
      - run: npm run build
