<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Cyber city demo artwork</title>
  <desc id="desc">Abstract neon city blocks reflected on a dark surface.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#09051f"/>
      <stop offset="1" stop-color="#18052d"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#6d28d9"/>
      <stop offset=".55" stop-color="#db2777"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <g fill="#111827" stroke="url(#neon)" stroke-width="8">
    <rect x="90" y="190" width="210" height="420" rx="18"/>
    <rect x="335" y="90" width="250" height="520" rx="18"/>
    <rect x="620" y="235" width="190" height="375" rx="18"/>
    <rect x="845" y="135" width="265" height="475" rx="18"/>
  </g>
  <path d="M0 650h1200v150H0z" fill="#030712"/>
  <path d="M120 680h960" stroke="url(#neon)" stroke-width="12" stroke-linecap="round"/>
  <circle cx="465" cy="350" r="92" fill="none" stroke="#f0abfc" stroke-width="16"/>
</svg>
